<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mis viajes: álbum interactivo de viajes en forma de visor, con mapa, fichas, fotos y recuerdos. Los viajes propios se guardan solo en el dispositivo.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1722">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis viajes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis viajes</title>
<link rel="canonical" href="https://jfolivarl.github.io/mis-viajes/">
<meta property="og:title" content="Mis viajes">
<meta property="og:description" content="Álbum interactivo de viajes en forma de visor: mapa, fichas, fotos y recuerdos.">
<meta property="og:url" content="https://jfolivarl.github.io/mis-viajes/">
<meta property="og:image" content="https://jfolivarl.github.io/mis-viajes/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css?v=20261114t">
<link rel="stylesheet" href="style.css?v=20261114t">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></symbol>
  <symbol id="i-foto" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-enlace" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-lapiz" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-izq" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-der" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-mundo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></symbol>
  <symbol id="i-papelera" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-estrella" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></symbol>
  <symbol id="i-subir" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
  <symbol id="i-capas" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-8.2 8.2a4.8 4.8 0 0 1-6.8-6.8l8.5-8.5a3.2 3.2 0 0 1 4.5 4.5l-8.5 8.5a1.6 1.6 0 0 1-2.3-2.3l7.8-7.8"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></symbol>
  <symbol id="i-nube" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.1 4.7 4.7 0 0 0 7 18.5zM12 10.5v6M9.5 14l2.5 2.5 2.5-2.5"/></symbol>
  <symbol id="i-avion" viewBox="0 0 24 24"><path d="M14.5 6.5l3-2.9a2.05 2.05 0 0 1 2.9 2.9l-2.9 3 2.5 7.5-2.5 2.55-3.5-6.55-3 3v3l-2 2-1.5-4.5-4.5-1.5 2-2h3l3-3-6.5-3.5 2.5-2.5z"/></symbol>
  <symbol id="i-filtro" viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.4V19l-3.6-1.8v-4.8z"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="5" height="5" rx="1"/><rect x="3.5" y="14.5" width="5" height="5" rx="1"/><path d="M11.5 7h9M11.5 17h9"/></symbol>
  <symbol id="i-mosaico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></symbol>
  <symbol id="i-recuerdo" viewBox="0 0 24 24"><path d="M1.5 5.2c3.5 1.3 7 1.8 10.5 1.8s7-.5 10.5-1.8" style="stroke:var(--muted)"/><g transform="rotate(-7 12 14)"><rect x="5.6" y="6.8" width="12.8" height="15" rx="1.2"/><rect x="7.4" y="8.6" width="9.2" height="8.6" rx=".5"/><path d="M7.6 15.6l2.6-2.7 1.9 1.8 1.5-1.4 2.8 2.6"/></g><circle cx="12" cy="6.6" r="1.9" style="fill:var(--oro);stroke:var(--oro)"/></symbol>
  <symbol id="i-yo" viewBox="0 0 24 24"><path d="M19.5 4.5L4.5 11l6.6 1.9 1.9 6.6z"/></symbol>
  <symbol id="i-corazon" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-6 6M10 20H4v-6M4 20l6-6"/></symbol>
  <symbol id="i-encoger" viewBox="0 0 24 24"><path d="M20 4l-6 6M14 5v5h5M4 20l6-6M10 19v-5H5"/></symbol>
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-diana" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></symbol>
</svg>

<header class="top">
  <svg class="deco" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="95"/><circle cx="100" cy="100" r="75"/><circle cx="100" cy="100" r="55"/><circle cx="100" cy="100" r="35"/><circle cx="100" cy="100" r="15"/></svg>
  <div class="brand">
    <img class="logo" src="logo.png" width="52" height="52" alt="Logo de Mis viajes">
    <div class="brand-t"><h1>Mis viajes</h1><p id="subtitulo">Viajes de ejemplo</p></div>
    <button type="button" id="b-copia" class="ib ib-h" aria-label="Mis viajes privados"><svg class="ic" aria-hidden="true"><use href="#i-nube"/></svg></button>
    <button type="button" id="b-editar" class="pill pill-h" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-lapiz"/></svg><span>Editar</span></button>
  </div>
</header>

<div id="aviso" class="aviso" hidden></div>

<main class="app">
  <section class="mapa-wrap" aria-label="Mapa">
    <form id="m-busca" class="m-busca" role="search" hidden>
      <label class="oculto" for="m-q">Buscar una dirección o un lugar</label>
      <input id="m-q" type="search" placeholder="Buscar dirección o lugar" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="ib ib-s" aria-label="Buscar"><svg class="ic" aria-hidden="true"><use href="#i-lupa"/></svg></button>
      <div id="m-res" class="m-res" aria-live="polite"></div>
    </form>
    <button type="button" id="m-logo" class="m-logo" aria-label="Ver todo el mapa"><img src="logo.png" width="72" height="72" alt=""></button>
    <div id="m-menu" class="m-menu" role="group" aria-label="Filtrar el mapa por viaje" hidden></div>
    <div id="mapa" class="mapa" tabindex="0" role="region" aria-label="Mapa de mis viajes. Arrastra para moverte, pellizca para acercar."></div>
  </section>
  <section id="panel" class="panel"></section>
</main>

<div id="elegir" class="elegir" hidden>
  <p>Mueve el mapa hasta dejar el lugar en el centro.</p>
  <div class="fila">
    <button type="button" class="pill" data-elegir="no">Cancelar</button>
    <button type="button" class="pill pri" data-elegir="si"><svg class="ic" aria-hidden="true"><use href="#i-diana"/></svg>Usar este punto</button>
  </div>
</div>

<div id="visor" class="visor" role="dialog" aria-modal="true" aria-labelledby="visor-t" hidden>
  <div class="v-barra">
    <p id="visor-t" class="v-cont"></p>
    <button type="button" class="v-btn" data-v="zoom" aria-pressed="false" aria-label="Ampliar la foto"><svg class="ic" aria-hidden="true"><use href="#i-lupa"/></svg></button>
    <button type="button" class="v-btn cz" data-v="fav" aria-pressed="false" aria-label="Foto favorita"><svg class="ic" aria-hidden="true"><use href="#i-corazon"/></svg></button>
    <button type="button" class="v-btn" data-v="cerrar" aria-label="Cerrar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="v-escena">
    <button type="button" class="v-btn v-ant" data-v="ant" aria-label="Foto anterior"><svg class="ic" aria-hidden="true"><use href="#i-izq"/></svg></button>
    <img id="visor-img" alt="">
    <button type="button" class="v-btn v-sig" data-v="sig" aria-label="Foto siguiente"><svg class="ic" aria-hidden="true"><use href="#i-der"/></svg></button>
  </div>
  <div class="v-pie">
    <p class="v-nombre" id="visor-nombre"></p>
    <p class="v-fecha" id="visor-fecha"></p>
    <p class="v-txt" id="visor-txt"></p>
    <div class="v-acc">
      <button type="button" class="pill pill-h" data-v="mapa"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>Ver en el mapa</button>
    </div>
    <div class="v-edit">
      <div class="fila">
        <button type="button" class="pill pill-h" data-v="editar"><svg class="ic" aria-hidden="true"><use href="#i-lapiz"/></svg>Editar punto</button>
        <button type="button" class="pill pill-h" data-v="colocar"><svg class="ic" aria-hidden="true"><use href="#i-diana"/></svg><span>Colocar en el mapa</span></button>
        <button type="button" class="pill pill-h" data-v="portada"><svg class="ic" aria-hidden="true"><use href="#i-estrella"/></svg><span>Usar de portada</span></button>
        <button type="button" class="pill pill-h peligro" data-v="quitar"><svg class="ic" aria-hidden="true"><use href="#i-papelera"/></svg><span>Quitar foto</span></button>
      </div>
    </div>
  </div>
</div>

<div id="hoja" class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t" hidden>
  <div class="h-caja" id="hoja-caja"></div>
</div>

<input id="fotos-in" class="oculto" type="file" accept="image/*" multiple aria-label="Elegir fotos">
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">Mis viajes necesita JavaScript para funcionar.</p></noscript>
<script src="leaflet.js?v=20261114t" defer></script>
<script src="viajes.js?v=20261114t" defer></script>
<script src="main.js?v=20261114t" defer></script>
</body>
</html>
